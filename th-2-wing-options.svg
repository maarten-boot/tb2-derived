<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Helvetica, Arial, sans-serif">
<rect width="1200" height="600" fill="#f7f7f4"/>
<text x="30" y="42" font-size="24" font-weight="bold" fill="#222">Thunderbird 2 — options for more lifting area</text>
<text x="30" y="66" font-size="14" fill="#555">Plan views, same scale, nose left. Baseline = v3 compound (canard + forward-swept wing, 4 lift fans, 2 dorsal cruise jets).</text>
<rect x="20" y="90" width="280" height="470" rx="10" fill="#fff" stroke="#ccc"/>
<text x="32" y="116" font-size="14" font-weight="bold" fill="#222">A · Bigger-span main wing</text>
<g transform="translate(-18,150) scale(0.34)"><polygon points="786,222 870,214 874,224 796,232" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="786,378 870,386 874,376 796,368" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="640,222 545,-12 610,-20 762,220" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="640,378 545,612 610,620 762,380" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="330,232 360,170 398,168 405,230" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="330,368 360,430 398,432 405,370" fill="#356d32" stroke="#1f441d" stroke-width="3"/><path d="M180,300 C180,262 215,232 290,226 L600,218 L800,228 L866,252 L874,300 L866,348 L800,372 L600,382 L290,374 C215,368 180,338 180,300 Z" fill="#3f7d3a" stroke="#1f441d" stroke-width="3"/><rect x="686" y="258" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><rect x="686" y="316" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><circle cx="578" cy="-16" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="578" cy="616" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="378" cy="166" r="40" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="378" cy="434" r="40" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><line x1="575" y1="70" x2="660" y2="58" stroke="#f0d264" stroke-width="4" stroke-dasharray="10 6"/><line x1="575" y1="530" x2="660" y2="542" stroke="#f0d264" stroke-width="4" stroke-dasharray="10 6"/></g>
<text x="32" y="400" font-size="12.5" fill="#1e7a3a">+ best cruise efficiency and range</text>
<text x="32" y="420" font-size="12.5" fill="#1e7a3a">+ more lift for short take-off</text>
<text x="32" y="440" font-size="12.5" fill="#b03a2e">− forward-sweep twist grows with span</text>
<text x="32" y="460" font-size="12.5" fill="#b03a2e">− bigger footprint at rescue sites</text>
<text x="44" y="480" font-size="12.5" fill="#333">→ folding tips (yellow dashed hinge)</text>
<text x="32" y="500" font-size="12.5" fill="#333" font-weight="bold">Fits: both (heavy: more area;</text>
<text x="32" y="520" font-size="12.5" fill="#333">fast: higher aspect ratio)</text>
<rect x="315" y="90" width="280" height="470" rx="10" fill="#fff" stroke="#ccc"/>
<text x="327" y="116" font-size="14" font-weight="bold" fill="#222">B · Tandem wing (Rutan-style)</text>
<g transform="translate(277,150) scale(0.34)"><polygon points="786,222 870,214 874,224 796,232" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="786,378 870,386 874,376 796,368" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="640,222 562,60 624,52 762,220" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="640,378 562,540 624,548 762,380" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="300,232 338,64 408,58 420,230" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="300,368 338,536 408,542 420,370" fill="#356d32" stroke="#1f441d" stroke-width="3"/><path d="M180,300 C180,262 215,232 290,226 L600,218 L800,228 L866,252 L874,300 L866,348 L800,372 L600,382 L290,374 C215,368 180,338 180,300 Z" fill="#3f7d3a" stroke="#1f441d" stroke-width="3"/><rect x="686" y="258" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><rect x="686" y="316" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><circle cx="594" cy="58" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="594" cy="542" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="373" cy="60" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="373" cy="540" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/></g>
<text x="327" y="400" font-size="12.5" fill="#1e7a3a">+ ~1.6× area in same span (Quickie, Proteus)</text>
<text x="327" y="420" font-size="12.5" fill="#1e7a3a">+ both wings lift: huge cargo CG range</text>
<text x="327" y="440" font-size="12.5" fill="#1e7a3a">+ fans sit naturally on both tips</text>
<text x="327" y="460" font-size="12.5" fill="#1e7a3a">+ tips can be joined by a boom (box frame)</text>
<text x="327" y="480" font-size="12.5" fill="#b03a2e">− front wing downwash hits rear wing</text>
<text x="327" y="500" font-size="12.5" fill="#b03a2e">− heavier, more drag at high speed</text>
<text x="327" y="520" font-size="12.5" fill="#333" font-weight="bold">Fits: SLOW / HEAVY</text>
<rect x="610" y="90" width="280" height="470" rx="10" fill="#fff" stroke="#ccc"/>
<text x="622" y="116" font-size="14" font-weight="bold" fill="#222">C · Three-surface + H-tail</text>
<g transform="translate(572,150) scale(0.34)"><polygon points="640,222 562,60 624,52 762,220" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="640,378 562,540 624,548 762,380" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="330,232 360,170 398,168 405,230" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="330,368 360,430 398,432 405,370" fill="#356d32" stroke="#1f441d" stroke-width="3"/><path d="M180,300 C180,262 215,232 290,226 L600,218 L800,228 L866,252 L874,300 L866,348 L800,372 L600,382 L290,374 C215,368 180,338 180,300 Z" fill="#3f7d3a" stroke="#1f441d" stroke-width="3"/><rect x="686" y="258" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><rect x="686" y="316" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><polygon points="786,222 870,214 874,224 796,232" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="786,378 870,386 874,376 796,368" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="808,196 872,190 876,410 812,404" fill="#2b5a28" stroke="#1f441d" stroke-width="3" opacity="0.95"/><circle cx="594" cy="58" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="594" cy="542" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="378" cy="166" r="40" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="378" cy="434" r="40" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/></g>
<text x="622" y="400" font-size="12.5" fill="#1e7a3a">+ widest cargo CG range (Piaggio P.180)</text>
<text x="622" y="420" font-size="12.5" fill="#1e7a3a">+ H-tail bridges the fins over the jets:</text>
<text x="634" y="440" font-size="12.5" fill="#333">shields exhaust and noise</text>
<text x="622" y="460" font-size="12.5" fill="#1e7a3a">+ small change to current design</text>
<text x="622" y="480" font-size="12.5" fill="#b03a2e">− extra wetted area and weight</text>
<text x="622" y="500" font-size="12.5" fill="#333" font-weight="bold">Fits: both variants</text>
<rect x="905" y="90" width="280" height="470" rx="10" fill="#fff" stroke="#ccc"/>
<text x="917" y="116" font-size="14" font-weight="bold" fill="#222">D · Wide blended body + air guides</text>
<g transform="translate(867,150) scale(0.34)"><polygon points="650,160 570,40 630,32 770,180" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="650,440 570,560 630,568 770,420" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="340,170 368,120 404,118 410,168" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="340,430 368,480 404,482 410,432" fill="#356d32" stroke="#1f441d" stroke-width="3"/><path d="M180,300 C180,232 230,176 320,166 L600,156 L810,182 L870,236 L878,300 L870,364 L810,418 L600,444 L320,434 C230,424 180,368 180,300 Z" fill="#3f7d3a" stroke="#1f441d" stroke-width="3"/><rect x="686" y="258" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><rect x="686" y="316" width="120" height="26" rx="13" fill="#8f969e" stroke="#3a3f45" stroke-width="2"/><g stroke="#f0d264" stroke-width="5"><line x1="330" y1="168" x2="805" y2="182"/><line x1="330" y1="432" x2="805" y2="418"/><line x1="600" y1="96" x2="640" y2="96"/><line x1="610" y1="504" x2="650" y2="504"/><line x1="450" y1="162" x2="450" y2="438" stroke-dasharray="12 8"/></g><polygon points="810,176 876,232 880,240 812,186" fill="#356d32" stroke="#1f441d" stroke-width="3"/><polygon points="810,424 876,368 880,360 812,414" fill="#356d32" stroke="#1f441d" stroke-width="3"/><circle cx="600" cy="36" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="600" cy="564" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="386" cy="118" r="40" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/><circle cx="386" cy="482" r="40" fill="#9aa1aa" stroke="#3a3f45" stroke-width="5"/></g>
<text x="917" y="400" font-size="12.5" fill="#1e7a3a">+ body carries 40–50 % of the lift</text>
<text x="917" y="420" font-size="12.5" fill="#1e7a3a">+ much bigger hold</text>
<text x="917" y="440" font-size="12.5" fill="#1e7a3a">+ chines / fences / endplates (yellow)</text>
<text x="929" y="460" font-size="12.5" fill="#333">stop air spilling round the edges</text>
<text x="917" y="480" font-size="12.5" fill="#b03a2e">− thick body: draggy above ~Mach 0.6</text>
<text x="917" y="500" font-size="12.5" fill="#b03a2e">− harder pressurisation (flat sides)</text>
<text x="917" y="520" font-size="12.5" fill="#333" font-weight="bold">Fits: SLOW / HEAVY</text>
<text x="30" y="590" font-size="12" fill="#555">Air guides: fences stop spanwise flow (MiG-15) · vortex generators keep flow attached · chines/LEX make vortex lift (SR-71, F/A-18) · endplates/winglets stop under-body pressure spilling over the edges.</text>
</svg>