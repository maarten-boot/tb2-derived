<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 910" width="1400" height="910" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fbf"/></marker></defs>
<rect width="1400" height="910" fill="#f7f7f4"/>
<text x="30" y="40" font-size="26" fill="#222" font-weight="bold" text-anchor="start">Thunderbird 2: how the tilting fans can work</text><text x="30" y="64" font-size="14" fill="#555" font-weight="normal" text-anchor="start">Pod tilt sequence, structural problems, three ways to mount a tilting fan, and a proposed fix for the Heavy layout</text><rect x="20" y="80" width="680" height="330" rx="10" fill="#fff" stroke="#ccc"/><text x="36" y="106" font-size="15" fill="#222" font-weight="bold" text-anchor="start">1 · How one pod tilts (side view, nose left)</text><path d="M78,284 C78,273 120,271 202,281 L202,285 C120,292 78,292 78,284 Z" fill="#b9d4b4" stroke="#6a8f65"/><line x1="140" y1="240" x2="140" y2="280" stroke="#6a8f65" stroke-width="5"/><g transform="rotate(0 140 240)"><rect x="70" y="227" width="140" height="26" rx="6" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="78" y1="240" x2="202" y2="240" stroke="#5a6068" stroke-width="3"/><circle cx="140" cy="240" r="6" fill="#3a3f45"/></g><line x1="140" y1="240" x2="140.0" y2="155.0" stroke="#2c6fbf" stroke-width="3" marker-end="url(#arr)"/><circle cx="140" cy="240" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="140" y="332" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Hover (0°)</text><path d="M288,284 C288,273 330,271 412,281 L412,285 C330,292 288,292 288,284 Z" fill="#b9d4b4" stroke="#6a8f65"/><line x1="350" y1="240" x2="350" y2="280" stroke="#6a8f65" stroke-width="5"/><g transform="rotate(-45 350 240)"><rect x="280" y="227" width="140" height="26" rx="6" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="288" y1="240" x2="412" y2="240" stroke="#5a6068" stroke-width="3"/><circle cx="350" cy="240" r="6" fill="#3a3f45"/></g><line x1="350" y1="240" x2="289.8959235991435" y2="179.89592359914346" stroke="#2c6fbf" stroke-width="3" marker-end="url(#arr)"/><circle cx="350" cy="240" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="350" y="332" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Transition (~45°)</text><path d="M498,284 C498,273 540,271 622,281 L622,285 C540,292 498,292 498,284 Z" fill="#b9d4b4" stroke="#6a8f65"/><line x1="560" y1="240" x2="560" y2="280" stroke="#6a8f65" stroke-width="5"/><g transform="rotate(-90 560 240)"><rect x="490" y="227" width="140" height="26" rx="6" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="498" y1="240" x2="622" y2="240" stroke="#5a6068" stroke-width="3"/><circle cx="560" cy="240" r="6" fill="#3a3f45"/></g><line x1="560" y1="240" x2="475.0" y2="240.0" stroke="#2c6fbf" stroke-width="3" marker-end="url(#arr)"/><circle cx="560" cy="240" r="9" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="560" y="332" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Cruise (90°)</text><text x="36" y="356" font-size="13" fill="#222" font-weight="normal" text-anchor="start">● Red circle = tilt axis (spanwise spindle), seen end-on. The drive shaft runs along this axis,</text><text x="36" y="374" font-size="13" fill="#222" font-weight="normal" text-anchor="start">   so tilting never disconnects the drive (V-22 principle). Blue = thrust. Light green = wing/boom behind.</text><text x="36" y="394" font-size="13" fill="#222" font-weight="normal" text-anchor="start">   Conversion 0° → 90° takes ~15–30 s while accelerating; actuators synchronised by fly-by-wire.</text><rect x="720" y="80" width="660" height="330" rx="10" fill="#fff" stroke="#ccc"/><text x="736" y="106" font-size="15" fill="#222" font-weight="bold" text-anchor="start">2 · What can go wrong, and the standard fixes</text><text x="736" y="136" font-size="13.5" fill="#b03a2e" font-weight="bold" text-anchor="start">Download</text><text x="736" y="153" font-size="13" fill="#222" font-weight="normal" text-anchor="start">fan airflow hitting a wing below costs ~10 % thrust (V-22).</text><text x="736" y="170" font-size="13" fill="#1e7a3a" font-weight="normal" text-anchor="start">Fix: no wing under a fan in plan view.</text><text x="736" y="188" font-size="13.5" fill="#b03a2e" font-weight="bold" text-anchor="start">Cantilever / whirl flutter</text><text x="736" y="205" font-size="13" fill="#222" font-weight="normal" text-anchor="start">heavy spinning pod on a long, flexible arm can flutter.</text><text x="736" y="222" font-size="13" fill="#1e7a3a" font-weight="normal" text-anchor="start">Fix: short stiff supports, ideally both sides.</text><text x="736" y="240" font-size="13.5" fill="#b03a2e" font-weight="bold" text-anchor="start">Hard-point loads</text><text x="736" y="257" font-size="13" fill="#222" font-weight="normal" text-anchor="start">pivot carries full thrust, 1.5× in fan-out, plus tilt torque.</text><text x="736" y="274" font-size="13" fill="#1e7a3a" font-weight="normal" text-anchor="start">Fix: pivot is a frame node in the torsion box.</text><text x="736" y="292" font-size="13.5" fill="#b03a2e" font-weight="bold" text-anchor="start">Gyroscopic moments</text><text x="736" y="309" font-size="13" fill="#222" font-weight="normal" text-anchor="start">tilting a spinning 14 m fan twists the structure.</text><text x="736" y="326" font-size="13" fill="#1e7a3a" font-weight="normal" text-anchor="start">Fix: left/right fans counter-rotate; slow tilt.</text><text x="736" y="344" font-size="13.5" fill="#b03a2e" font-weight="bold" text-anchor="start">Cruise drag</text><text x="736" y="361" font-size="13" fill="#222" font-weight="normal" text-anchor="start">duct edge-on to the flow in hover position.</text><text x="736" y="378" font-size="13" fill="#1e7a3a" font-weight="normal" text-anchor="start">Fix: tilt 90° fwd, duct = ring wing (some lift).</text><rect x="20" y="430" width="300" height="460" rx="10" fill="#fff" stroke="#ccc"/><text x="34" y="456" font-size="15" fill="#222" font-weight="bold" text-anchor="start">A · Tip spindle</text><text x="34" y="474" font-size="12" fill="#555" font-weight="normal" text-anchor="start">plan view · Bell X-22A, V-22 (rotor)</text><rect x="330" y="430" width="300" height="460" rx="10" fill="#fff" stroke="#ccc"/><text x="344" y="456" font-size="15" fill="#222" font-weight="bold" text-anchor="start">B · Fork / ladder bay</text><text x="344" y="474" font-size="12" fill="#555" font-weight="normal" text-anchor="start">plan view · duct between two rails</text><rect x="640" y="430" width="300" height="460" rx="10" fill="#fff" stroke="#ccc"/><text x="654" y="456" font-size="15" fill="#222" font-weight="bold" text-anchor="start">C · Fan-in-body + louvres</text><text x="654" y="474" font-size="12" fill="#555" font-weight="normal" text-anchor="start">plan view · Ryan XV-5 Vertifan</text><rect x="40" y="535" width="120" height="50" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><text x="60" y="525" font-size="12" fill="#555" font-weight="normal" text-anchor="start">wing</text><line x1="140" y1="560" x2="160" y2="560" stroke="#c0392b" stroke-width="6"/><circle cx="215" cy="560" r="55" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="160" y1="560" x2="270" y2="560" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/><text x="150" y="640" font-size="12" fill="#c0392b" font-weight="normal" text-anchor="middle">spindle on one side only</text><rect x="370" y="500" width="220" height="16" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><rect x="370" y="604" width="220" height="16" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><text x="592" y="484" font-size="11" fill="#555" font-weight="normal" text-anchor="end">wing = rung</text><rect x="412" y="490" width="10" height="140" fill="#4a4f55"/><rect x="538" y="490" width="10" height="140" fill="#4a4f55"/><circle cx="480" cy="560" r="44" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="422" y1="560" x2="436" y2="560" stroke="#c0392b" stroke-width="6"/><line x1="524" y1="560" x2="538" y2="560" stroke="#c0392b" stroke-width="6"/><text x="417" y="648" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">inner rail</text><text x="543" y="648" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">outer rail</text><rect x="680" y="500" width="220" height="120" rx="8" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><circle cx="790" cy="560" r="44" fill="#2a2e33" stroke="#111" stroke-width="2"/><line x1="752" y1="528" x2="744" y2="592" stroke="#9aa1aa" stroke-width="3"/><line x1="764" y1="528" x2="756" y2="592" stroke="#9aa1aa" stroke-width="3"/><line x1="776" y1="528" x2="768" y2="592" stroke="#9aa1aa" stroke-width="3"/><line x1="788" y1="528" x2="780" y2="592" stroke="#9aa1aa" stroke-width="3"/><line x1="800" y1="528" x2="792" y2="592" stroke="#9aa1aa" stroke-width="3"/><line x1="812" y1="528" x2="804" y2="592" stroke="#9aa1aa" stroke-width="3"/><line x1="824" y1="528" x2="816" y2="592" stroke="#9aa1aa" stroke-width="3"/><text x="790" y="648" font-size="11" fill="#555" font-weight="normal" text-anchor="middle">fixed fan, exit louvres vector ±45°</text><text x="34" y="690" font-size="12.5" fill="#1e7a3a" font-weight="normal" text-anchor="start">+ proven (X-22A ducts, V-22 nacelles)</text><text x="34" y="712" font-size="12.5" fill="#1e7a3a" font-weight="normal" text-anchor="start">+ wing ends where the duct starts: no download</text><text x="34" y="734" font-size="12.5" fill="#b03a2e" font-weight="normal" text-anchor="start">− cantilever: heavy wing tip, flutter risk</text><text x="34" y="756" font-size="12.5" fill="#b03a2e" font-weight="normal" text-anchor="start">− only works at a tip, not mid-span</text><text x="34" y="778" font-size="12.5" fill="#333" font-weight="bold" text-anchor="start">Fits: Fast canard tips and H-tail tips</text><text x="344" y="690" font-size="12.5" fill="#1e7a3a" font-weight="normal" text-anchor="start">+ pivots on both sides: no cantilever</text><text x="344" y="712" font-size="12.5" fill="#1e7a3a" font-weight="normal" text-anchor="start">+ rails + wings form a stiff ladder frame</text><text x="344" y="734" font-size="12.5" fill="#1e7a3a" font-weight="normal" text-anchor="start">+ fans sit in bays between wings: no download</text><text x="344" y="756" font-size="12.5" fill="#b03a2e" font-weight="normal" text-anchor="start">− extra rail weight and drag</text><text x="344" y="778" font-size="12.5" fill="#333" font-weight="bold" text-anchor="start">Fits: Heavy (all 6), Fast wing fans</text><text x="654" y="690" font-size="12.5" fill="#1e7a3a" font-weight="normal" text-anchor="start">+ no tilt mechanism; doors closed in cruise</text><text x="654" y="712" font-size="12.5" fill="#b03a2e" font-weight="normal" text-anchor="start">− needs deep structure: a 14 m fan does</text><text x="654" y="734" font-size="12.5" fill="#333" font-weight="normal" text-anchor="start">   not fit beside a 6 m hold (only ~10 m)</text><text x="654" y="756" font-size="12.5" fill="#b03a2e" font-weight="normal" text-anchor="start">− dead weight in cruise; limited vectoring</text><text x="654" y="778" font-size="12.5" fill="#333" font-weight="bold" text-anchor="start">Fits: possibly smaller middle fans (D4)</text><rect x="960" y="430" width="420" height="460" rx="10" fill="#fff" stroke="#2b5a28" stroke-width="2"/><text x="974" y="456" font-size="15" fill="#2b5a28" font-weight="bold" text-anchor="start">D · Proposed Heavy layout: ladder frame</text><text x="974" y="474" font-size="12" fill="#555" font-weight="normal" text-anchor="start">plan view, 4 px/m · fans alternate with wings</text><polygon points="1095.8,608.2 1095.8,536.2 1128.2,536.2 1135.4,608.2" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><polygon points="1095.8,701.8 1095.8,773.8 1128.2,773.8 1135.4,701.8" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><polygon points="1196.6,608.2 1178.6,536.2 1211.0,536.2 1239.8,608.2" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><polygon points="1196.6,701.8 1178.6,773.8 1211.0,773.8 1239.8,701.8" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><polygon points="1247.0,608.2 1279.4,601.0 1283.0,604.6 1254.2,611.8" fill="#2b5a28" stroke="#1f441d"/><polygon points="1247.0,701.8 1279.4,709.0 1283.0,705.4 1254.2,698.2" fill="#2b5a28" stroke="#1f441d"/><path d="M995.0,655.0 C995.0,622.6 1013.0,608.2 1038.2,608.2 L1261.4,608.2 L1283.0,633.4 L1283.0,676.6 L1261.4,701.8 L1038.2,701.8 C1013.0,701.8 995.0,687.4 995.0,655.0 Z" fill="#3f7d3a" stroke="#1f441d" stroke-width="2"/><rect x="1031.0" y="600.1" width="259.2" height="5.4" fill="#4a4f55"/><rect x="1031.0" y="546.1" width="259.2" height="5.4" fill="#4a4f55"/><circle cx="1067.0" cy="575.8" r="25.2" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="1067.0" y1="599.9" x2="1067.0" y2="599.9" stroke="#c0392b" stroke-width="5"/><line x1="1067.0" y1="551.7" x2="1067.0" y2="551.7" stroke="#c0392b" stroke-width="5"/><circle cx="1160.6" cy="575.8" r="25.2" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="1160.6" y1="599.9" x2="1160.6" y2="599.9" stroke="#c0392b" stroke-width="5"/><line x1="1160.6" y1="551.7" x2="1160.6" y2="551.7" stroke="#c0392b" stroke-width="5"/><circle cx="1261.4" cy="575.8" r="25.2" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="1261.4" y1="599.9" x2="1261.4" y2="599.9" stroke="#c0392b" stroke-width="5"/><line x1="1261.4" y1="551.7" x2="1261.4" y2="551.7" stroke="#c0392b" stroke-width="5"/><rect x="1031.0" y="704.5" width="259.2" height="5.4" fill="#4a4f55"/><rect x="1031.0" y="758.5" width="259.2" height="5.4" fill="#4a4f55"/><circle cx="1067.0" cy="734.2" r="25.2" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="1067.0" y1="710.1" x2="1067.0" y2="710.1" stroke="#c0392b" stroke-width="5"/><line x1="1067.0" y1="758.3" x2="1067.0" y2="758.3" stroke="#c0392b" stroke-width="5"/><circle cx="1160.6" cy="734.2" r="25.2" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="1160.6" y1="710.1" x2="1160.6" y2="710.1" stroke="#c0392b" stroke-width="5"/><line x1="1160.6" y1="758.3" x2="1160.6" y2="758.3" stroke="#c0392b" stroke-width="5"/><circle cx="1261.4" cy="734.2" r="25.2" fill="#9aa1aa" stroke="#3a3f45" stroke-width="2.5"/><line x1="1261.4" y1="710.1" x2="1261.4" y2="710.1" stroke="#c0392b" stroke-width="5"/><line x1="1261.4" y1="758.3" x2="1261.4" y2="758.3" stroke="#c0392b" stroke-width="5"/><rect x="1137.2" y="645.6" width="21.6" height="8.6" fill="#c9632f" stroke="#7a3a18" stroke-width="0.8"/><rect x="1137.2" y="655.7" width="21.6" height="8.6" fill="#c9632f" stroke="#7a3a18" stroke-width="0.8"/><rect x="1162.4" y="645.6" width="21.6" height="8.6" fill="#c9632f" stroke="#7a3a18" stroke-width="0.8"/><rect x="1162.4" y="655.7" width="21.6" height="8.6" fill="#c9632f" stroke="#7a3a18" stroke-width="0.8"/><path d="M1002.2,644.2 Q1005.8,633.4 1020.2,633.4 L1020.2,676.6 Q1005.8,676.6 1002.2,665.8 Z" fill="#1d2b3a"/><text x="974" y="800" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">Front fan · front wing · middle fan · rear wing · rear fan:</text><text x="974" y="815" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">no wing under any fan (no download).</text><text x="974" y="830" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">Each fan pivots on an inner and an outer rail (option B);</text><text x="974" y="845" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">the wings are the rungs that tie the rails to the body.</text><text x="974" y="860" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">In cruise the front fans also blow over the front wing.</text><text x="974" y="875" font-size="11.5" fill="#222" font-weight="normal" text-anchor="start">Span ≈ 66 m; middle pair stays at the CG over the hold.</text>
</svg>